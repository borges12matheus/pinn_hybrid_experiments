experiment:
  name: k_epsilon
  seed: 42

paths:
  root: .
  data_process_dir: data/data_processed
  data_cfd_dir: data/data_cfd
  results_dir: results
  models_dir: results/models
  metrics_dir: results/metrics
  plots_dir: results/plots
  logs_dir: logs

dataset:
  parquet: dataset_bfs_2d_kepsilon_with_wz.parquet
  test_output: dataset_test_pinn

features:
  - x
  - y
  - Ux
  - Uy
  - p
  - k
  - nut_log
  - Re

targets:
  - dUx
  - dUy
  - dp

model:
  type: pinn
  width: 64
  depth: 4
  activation: tanh

training:
  batch_size: 4096
  epochs: 1000
  lr: 1e-3
  weight_decay: 1e-6

early_stopping:
  patience: 20

scheduler:
  factor: 0.5
  patience: 10

split:
  strategy: spatial_x_quantile
  column: x
  bins: 8
  test_frac: 0.2
  version: v1

pinn:
  physics_mode: cont_mom
  nut_transform: exp
  epochs_pre: 500
  epochs_phys: 300
  w_data: 1.0
  w_cont: 1e-5
  w_mom: 1e-5
