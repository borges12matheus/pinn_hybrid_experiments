experiment:
  name: cont_base
  type: k_epsilon
  seed: 42

paths:
  root: .
  data_process_dir: data/data_processed
  data_cfd_dir: data/data_cfd
  results_dir: results
  models_dir: results/models
  metrics_dir: results/metrics
  plots_dir: results/plots
  logs_dir: logs

dataset:
  parquet: dataset_bfs_2d_kepsilon_Re36000_full.parquet
  test_output: dataset_test_pinn

features:
  - x
  - y
  - Ux
  - Uy
  - p
  - Re_norm

targets:
  - dUx
  - dUy
  - dp

model:
  type: pinn
  width: 64
  depth: 4
  activation: tanh

training:
  batch_size: 4096
  epochs: 2000
  lr: 1e-3
  weight_decay: 1e-6

early_stopping:
  patience: 20

scheduler:
  factor: 0.5
  patience: 10

split:
  strategy: spatial_x_quantile
  column: x
  bins: 8
  val_frac: 0.1
  test_frac: 0.2
  version: v2

pinn:
  physics_mode: continuity
  nut_transform: exp
  epochs_pre: 2000
  epochs_phys: 2000
  w_data: 1.0
  w_cont: 7.5e-5
  w_mom: 1e-5
