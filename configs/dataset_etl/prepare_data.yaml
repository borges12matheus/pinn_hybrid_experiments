experiment:
  name: prepare_v1
  type: k_epsilon
  seed: 42

paths:
  root: .
  data_process_dir: data/data_processed
  data_cfd_dir: data/data_cfd
  results_dir: results
  models_dir: results/models
  metrics_dir: results/metrics
  plots_dir: results/plots
  logs_dir: logs

cfd_data:
  dataset: grid_pinn_epsilon_k_nut_p_U.xy
  path_coarse: cfd_rans_k_epsilon/Re_36000/coarse
  path_fine: cfd_rans_k_epsilon/Re_36000/fine
  out_name: dataset_bfs_2d_kepsilon_Re36000_with_sxy_wz.parquet
  Re: 36000

dataset:
  parquet: dataset_bfs_2d_kepsilon_Re20K_Re_36K_with_sxy_wz.parquet
  test_output: dataset_test_pinn

features:
  - x
  - y
  - Ux
  - Uy
  - p
  - epsilon
  - k
  - nut_log
  - wz_log
  - sxy_log
  - div_u_log
  - Re_norm
  - depsilon
  - dk
  - dnut
  - dwz

targets:
  - dUx
  - dUy
  - dp

model:
  type: pinn
  width: 64
  depth: 4
  activation: tanh

training:
  batch_size: 4096
  epochs: 1000
  lr: 1e-3
  weight_decay: 1e-6

early_stopping:
  patience: 20

scheduler:
  factor: 0.5
  patience: 10

split:
  strategy: spatial_x_quantile
  column: x
  bins: 8
  test_frac: 0.2
  version: v1

pinn:
  physics_mode: continuity
  epochs_pre: 1000
  epochs_phys: 500
  w_data: 1.0
  w_cont: 1e-6
