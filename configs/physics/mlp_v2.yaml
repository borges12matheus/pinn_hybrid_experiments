experiment:
  name: v2
  type: k_epsilon
  seed: 42

paths:
  root: .
  data_process_dir: data/data_processed
  data_cfd_dir: data/data_cfd
  results_dir: results
  models_dir: results/models
  metrics_dir: results/metrics
  plots_dir: results/plots
  logs_dir: logs

dataset:
  parquet: dataset_bfs_2d_kepsilon_with_sxy_wz.parquet
  test_output: dataset_test_mlp

features:
  - x
  - y
  - Ux
  - Uy
  - p
  - epsilon
  - k
  - nut_log
  - wz_log
  - sxy_log
  - div_u_log
  - Re
  - depsilon
  - dk
  - dnut
  - dwz

targets:
  - dUx
  - dUy
  - dp

model:
  type: mlp
  width: 64
  depth: 4
  activation: tanh

training:
  batch_size: 4096
  epochs: 1500
  lr: 1e-3
  weight_decay: 1e-6

early_stopping:
  patience: 20

scheduler:
  factor: 0.5
  patience: 10

split:
  strategy: spatial_x_quantile
  column: x
  bins: 8
  test_frac: 0.2
  version: v1
