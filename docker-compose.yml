x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /app
  gpus: all
  shm_size: "8gb"
  ipc: host
  environment:
    PYTHONHASHSEED: "42"
    CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
  volumes:
    - ./data:/app/data
    - ./results:/app/results
    - ./logs:/app/logs
    - ./configs:/app/configs:ro
    - ./src:/app/src:ro
  restart: "no"

services:
  prepare_train_data:
    <<: *common
    container_name: bfs_2d_prepare_data
    command: python src/prepare_data.py --config configs/dataset_etl/prepare_data.yaml
  
  train_mlp:
    <<: *common
    container_name: bfs_2d_mlp_train
    command: python src/train_mlp.py --config configs/baseline/mlp_base.yaml

  train_pinn:
    <<: *common
    container_name: bfs_2d_pinn_train
    command: python src/train_pinn.py --config configs/baseline/pinn_mom_base.yaml

  run_train_pipeline:
    <<: *common
    container_name: bfs_2d_run_train_pipe
    command: python src/run_baseline_pair.py
      --mlp-config configs/baseline/mlp_base.yaml
      --pinn-config configs/baseline/pinn_cont_base.yaml
      --mlp-command "python src/train_mlp.py --config {config}"
      --pinn-command "python src/train_pinn.py --config {config}"
      --mlp-predictions-glob "results/metrics/mlp/**/*_physics_predictions.parquet"
      --pinn-predictions-glob "results/metrics/pinn/**/*_physics_predictions.parquet"
      --output-dir results/comparisons/mlp_vs_pinn_cont_seed42
      #--validate-only

  clean_experiments:
    <<: *common
    container_name: bfs_2d_cleanup
    command: python src/cleanup_experiments.py
    ## --apply --yes

  compare_experiments:
    <<: *common
    container_name: bfs_2d_compare_exp
    command: python src/compare_divergence_models.py --mlp-predictions results/metrics/mlp/mlp_base_20260729_192246/mlp_base_d4_w64_seed42_physics_predictions.parquet --pinn-predictions results/metrics/pinn/pinn_mom_base_20260825_215647/pinn_mom_base_d4_w64_seed42_physics_predictions.parquet --output-dir results/comparisons/mlp_pinn_seed42